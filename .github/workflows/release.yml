name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm bench:performance:quick
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e --workers=2
      - name: Read package metadata
        id: package
        shell: bash
        working-directory: packages/vue
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Validate package tarball
        run: npm publish --dry-run --access public --tag "${{ inputs.tag }}"
        working-directory: packages/vue
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish or promote package
        shell: bash
        working-directory: packages/vue
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            npm dist-tag add "$PACKAGE_NAME@$PACKAGE_VERSION" "$RELEASE_TAG"
            echo "Promoted $PACKAGE_NAME@$PACKAGE_VERSION to $RELEASE_TAG."
          else
            npm publish --access public --tag "$RELEASE_TAG" --provenance
          fi
